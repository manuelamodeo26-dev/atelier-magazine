name: Rename the ATELIER brand

on:
  push:
    branches: [main]
    paths:
      - scripts/rename_brand.py
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rename_brand.py
      - name: Commit the brand name
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Brand name already correct"
            exit 0
          fi
          git commit -m "Rename brand to ATELIER"
          git push
