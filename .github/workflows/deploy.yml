name: Deploy ATELIER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install feed image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Run editorial and archive tests
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/validate_archive.py
  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check article-page.js
          node --check account.js
          node --check sw.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
