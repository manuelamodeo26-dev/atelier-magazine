name: Update ATELIER news

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/news.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-atelier-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect RSS and Atom articles
        run: python scripts/fetch_news.py
      - name: Validate generated archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/articles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(data.get('articles'), list), 'articles deve essere una lista'
          assert data['articles'], 'L’archivio non contiene articoli: non pubblicare un archivio vuoto'
          for article in data['articles']:
              assert article.get('title') and article.get('url', '').startswith(('http://', 'https://'))
          print(f"Archivio valido: {len(data['articles'])} articoli")
          PY
      - name: Commit updated archive
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No archive changes."
          else
            git commit -m "chore: update ATELIER news"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-updated-news:
    needs: update-news
    if: needs.update-news.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site and news
        id: deployment
        uses: actions/deploy-pages@v4
